[platformio]
default_envs = watch_dev
src_dir = main
test_dir = test

[env]
lib_extra_dirs = ../shared

[watch_base]
platform = platformio/espressif32@6.13.0
framework = espidf
board = esp32-s3-devkitc-1
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
; Each upload must fit one application slot, not the complete flash device.
board_upload.maximum_size = 6291456
board_upload.after_reset = watchdog_reset
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

[env:watch_dev]
extends = watch_base
; Hardware safety tripwire: never set irreversible device writes to 1.
build_flags =
    -DCHATESP_DEVELOPMENT_MODE=1
    -DCHATESP_ALLOW_IRREVERSIBLE_DEVICE_WRITES=0
board_build.cmake_extra_args = -DCHATESP_PERMANENT_WRITE_POLICY=FORBID -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;config/watch_dev.defaults"

[env:watch_prod]
extends = watch_base
; Production must obey the same no-eFuse policy as development.
build_flags =
    -DCHATESP_DEVELOPMENT_MODE=0
    -DCHATESP_ALLOW_IRREVERSIBLE_DEVICE_WRITES=0
board_build.cmake_extra_args = -DCHATESP_PERMANENT_WRITE_POLICY=FORBID -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;config/watch_prod.defaults"

[env:native]
platform = platformio/native@1.2.1
test_framework = unity
test_build_src = false
lib_compat_mode = off
