<svg xmlns="http://www.w3.org/2000/svg" width="1728" height="512" viewBox="0 0 1728 512">
  <defs>
    <style>
      @font-face { font-family: "Montserrat"; src: url("../../firmware/managed_components/lvgl__lvgl/scripts/built_in_font/Montserrat-Medium.ttf"); font-weight: 500; }
      @font-face { font-family: "ChatESP Clock"; src: url("../../firmware/managed_components/lvgl__lvgl/examples/libs/freetype/Lato-Regular.ttf"); }
      .ui { font-family: "Montserrat", "Arial", sans-serif; font-weight: 500; }
      .status { fill: #fff; font-size: 24px; letter-spacing: 2px; }
      .hint { fill: #777; font-size: 14px; letter-spacing: 1px; }
      .content { fill: #fff; font-size: 18px; }
      .footer { fill: #777; font-size: 14px; letter-spacing: 1px; }
      .control-title { fill: #8e8e93; font-size: 14px; letter-spacing: 1px; }
      .control-value { fill: #fff; font-size: 14px; }
      .clock-time { fill: #fff; font-family: "ChatESP Clock", "Arial", sans-serif; font-size: 180px; font-weight: 400; letter-spacing: -10px; }
    </style>
    <filter id="screen-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <rect width="1728" height="512" fill="#101012"/>

  <!-- LISTENING: firmware/main/ui.cpp, 368 x 448 portrait layout. -->
  <g transform="translate(32 32)" filter="url(#screen-shadow)">
    <rect width="368" height="448" rx="48" fill="#000" stroke="#303033" stroke-width="2"/>
    <text font-family="Montserrat" font-weight="500" fill="#fff" font-size="24" letter-spacing="2" x="16" y="69">LISTENING</text>
    <text font-family="Montserrat" font-weight="500" fill="#777" font-size="14" letter-spacing="1" x="16" y="99">RELEASE TO SEND</text>
    <rect x="16" y="397" width="336" height="3" rx="1.5" fill="#202020"/>
    <rect x="16" y="397" width="196" height="3" rx="1.5" fill="#fff"/>
    <g transform="translate(30 413)" fill="none" stroke="#777" stroke-width="2">
      <path d="M0 7 Q7 0 14 7"/>
      <path d="M3 10 Q7 6 11 10"/>
      <circle cx="7" cy="13" r="1" fill="#777" stroke="none"/>
    </g>
    <text font-family="Montserrat" font-weight="500" fill="#777" font-size="14" letter-spacing="1" x="52" y="430">ONLINE</text>
    <g transform="translate(275 416)" fill="none" stroke="#777" stroke-width="2">
      <rect width="21" height="11" rx="2"/>
      <rect x="22" y="3" width="2" height="5" fill="#777" stroke="none"/>
      <rect x="3" y="3" width="14" height="5" fill="#777" stroke="none"/>
    </g>
    <text font-family="Montserrat" font-weight="500" fill="#777" font-size="14" x="304" y="430">82%</text>
  </g>

  <!-- ANSWER: exact status, hint, content, and footer coordinates. -->
  <g transform="translate(440 32)" filter="url(#screen-shadow)">
    <rect width="368" height="448" rx="48" fill="#000" stroke="#303033" stroke-width="2"/>
    <rect x="162" y="8" width="44" height="4" rx="2" fill="#6b6b70"/>
    <text font-family="Montserrat" font-weight="500" fill="#fff" font-size="24" letter-spacing="2" x="16" y="69">ANSWER</text>
    <text font-family="Montserrat" font-weight="500" fill="#777" font-size="14" letter-spacing="1" x="16" y="99">RECEIVING</text>
    <text font-family="Montserrat" font-weight="500" fill="#fff" font-size="18" x="16" y="148">
      <tspan x="16" dy="0">The weather will stay clear</tspan>
      <tspan x="16" dy="25">through the afternoon.</tspan>
    </text>
    <g transform="translate(30 413)" fill="none" stroke="#777" stroke-width="2">
      <path d="M0 7 Q7 0 14 7"/>
      <path d="M3 10 Q7 6 11 10"/>
      <circle cx="7" cy="13" r="1" fill="#777" stroke="none"/>
    </g>
    <text font-family="Montserrat" font-weight="500" fill="#777" font-size="14" letter-spacing="1" x="52" y="430">ONLINE</text>
    <g transform="translate(275 416)" fill="none" stroke="#777" stroke-width="2">
      <rect width="21" height="11" rx="2"/>
      <rect x="22" y="3" width="2" height="5" fill="#777" stroke="none"/>
      <rect x="3" y="3" width="14" height="5" fill="#777" stroke="none"/>
    </g>
    <text font-family="Montserrat" font-weight="500" fill="#777" font-size="14" x="304" y="430">82%</text>
  </g>

  <!-- CONTROLS: exact 280 px panel and slider geometry from ui.cpp. -->
  <g transform="translate(848 32)" filter="url(#screen-shadow)">
    <rect width="368" height="448" rx="48" fill="#000" stroke="#303033" stroke-width="2"/>
    <rect x="0" y="-12" width="368" height="280" rx="28" fill="#101012" stroke="#38383d"/>
    <rect x="162" y="10" width="44" height="4" rx="2" fill="#6b6b70"/>
    <text font-family="Montserrat" font-weight="500" fill="#fff" font-size="18" letter-spacing="2" x="24" y="50">CONTROLS</text>

    <text font-family="Montserrat" font-weight="500" fill="#8e8e93" font-size="14" letter-spacing="1" x="24" y="85">BRIGHTNESS</text>
    <text font-family="Montserrat" font-weight="500" fill="#fff" font-size="14" x="316" y="85">65%</text>
    <rect x="40" y="112" width="288" height="12" rx="6" fill="#28282c"/>
    <rect x="40" y="112" width="187" height="12" rx="6" fill="#f2f2f7"/>
    <circle cx="227" cy="118" r="16" fill="#fff"/>

    <text font-family="Montserrat" font-weight="500" fill="#8e8e93" font-size="14" letter-spacing="1" x="24" y="179">VOLUME</text>
    <text font-family="Montserrat" font-weight="500" fill="#fff" font-size="14" x="316" y="179">70%</text>
    <rect x="40" y="206" width="288" height="12" rx="6" fill="#28282c"/>
    <rect x="40" y="206" width="202" height="12" rx="6" fill="#f2f2f7"/>
    <circle cx="242" cy="212" r="16" fill="#fff"/>
  </g>

  <!-- CLOCK: 448 x 368 landscape Lato clock face at 11:24:59. -->
  <g transform="translate(1248 72)" filter="url(#screen-shadow)">
    <rect width="448" height="368" rx="48" fill="#000" stroke="#303033" stroke-width="2"/>
    <rect x="162" y="8" width="44" height="4" rx="2" fill="#6b6b70" transform="translate(40 0)"/>
    <path d="M224 10 H390 A48 48 0 0 1 438 58 V310 A48 48 0 0 1 390 358 H58 A48 48 0 0 1 10 310 V58 A48 48 0 0 1 58 10 Z" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round"/>

    <text class="clock-time" x="224" y="250" text-anchor="middle">11:24</text>
  </g>
</svg>
