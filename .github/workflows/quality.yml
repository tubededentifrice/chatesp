name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: true
      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          enable-cache: false
          version: "0.12.4"
      - name: Install locked tools
        run: uv sync --locked
      - name: Check dependency pins and age
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run --locked opendle-deps check
      - name: Run repository tests
        run: uv run --locked python -m unittest discover -s tests -p 'test_*.py'
      - name: Scan commit candidates for secrets
        run: uv run --locked opendle-secrets check

  linux-product:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: true
      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          enable-cache: false
          version: "0.12.4"
      - name: Install locked tools
        run: uv sync --locked
      - name: Check dependencies before product builds
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run --locked opendle-deps check
      - name: Run native firmware tests
        run: uv run --locked python tools/pio.py test -e native
      - name: Build watch development firmware
        run: uv run --locked python tools/pio.py run -e watch_dev
      - name: Validate watch development firmware contract
        run: >-
          uv run --locked python tools/firmware_contract.py
          --environment watch_dev
      - name: Build watch production firmware
        run: uv run --locked python tools/pio.py run -e watch_prod
      - name: Validate watch production firmware contract
        run: >-
          uv run --locked python tools/firmware_contract.py
          --environment watch_prod
      - name: Configure the documented simulator build
        run: >-
          cmake -S simulator -B simulator/.build/cmake
          -DCHATESP_APP_CORE_DIR="$PWD/firmware/lib/app_core"
          -DCHATESP_PROVISIONING_CORE_DIR="$PWD/firmware/lib/provisioning_core"
          -DCHATESP_BLE_CORE_DIR="$PWD/firmware/lib/ble_core"
      - name: Build and test the documented simulator path
        run: >-
          cmake --build simulator/.build/cmake &&
          ctest --test-dir simulator/.build/cmake --output-on-failure
      - name: Run the sanitized product simulator
        run: uv run --locked python simulator/tools/build.py --test --sanitize

  ios:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build the unsigned iOS app
        run: >-
          xcodebuild
          -project ios/ChatESP.xcodeproj
          -scheme ChatESP
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Run the iOS test bundle
        run: >-
          xcodebuild
          -project ios/ChatESP.xcodeproj
          -scheme ChatESP
          -configuration Debug
          -destination 'platform=iOS Simulator,name=iPhone 17 Pro'
          CODE_SIGNING_ALLOWED=NO
          test
